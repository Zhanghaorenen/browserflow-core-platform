server {
  listen 80;
  server_name _;
  client_max_body_size 1m;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://web:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /admin/ { proxy_pass http://web:8000; proxy_set_header Host $host; }
  location /static/ { alias /srv/static/; }
  location /ws/ {
    proxy_pass http://web:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
  }
}
