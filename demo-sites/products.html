<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>Flow Market · 产品目录</title><style>body{font:16px system-ui;max-width:1000px;margin:60px auto;background:#f5f7fb;color:#0f172a}article{background:white;padding:24px;margin:12px;border-radius:12px;display:flex;justify-content:space-between}header{padding:12px}a{color:#2563eb}</style><header><h1>Flow Market</h1><p>公开产品目录 · BrowserFlow 隔离业务测试环境</p><a href="/dynamic">动态产品列表</a> · <a href="/form">业务申请</a></header><main id="products"></main><script>const names=['Cloud Console','Data Studio','Flow Scheduler','Trace Explorer','Agent Workspace','Audit Center','Browser Monitor','Result Vault','Team Hub','API Gateway'];let page=1;function render(){document.querySelector('main').innerHTML=names.slice((page-1)*5,page*5).map((name,i)=>`<article data-product><strong data-name>${name}</strong><span data-price>¥${(page-1)*500+(i+1)*100}.00</span><a href="/products?id=${(page-1)*5+i+1}">来源详情</a></article>`).join('');document.querySelector('main').dataset.page=page}render()</script><button onclick="page=page===1?2:1;render()">下一页</button></html>
