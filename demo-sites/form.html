<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>企业业务申请</title><style>body{font:16px system-ui;background:#f5f7fb;max-width:640px;margin:60px auto}form{background:white;padding:36px;border-radius:16px}label{display:block;margin:20px 0}input,textarea{display:block;padding:12px;width:90%;border:1px solid #cbd5e1;border-radius:8px}button{background:#2563eb;color:white;border:0;padding:12px 24px;border-radius:8px}</style><h1>企业业务申请</h1><p>正式提交必须获得 BrowserFlow 人工审批。</p><form data-version="1"><label>申请人<input name="applicant" required></label><label>部门<input name="department" required></label><label>申请原因<textarea name="reason" required></textarea></label><input type="hidden" name="idempotency_key"><button>提交申请</button></form><p id="result"></p><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const response=await fetch('/api/applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const data=await response.json();if(response.ok){const p=document.querySelector('#result');p.dataset.receipt=data.receipt;p.textContent='已提交 · 回执 '+data.receipt}else{document.querySelector('#result').textContent='提交失败'}}</script></html>
