<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>动态产品目录</title><style>body{font:16px system-ui;max-width:900px;margin:60px auto}article{padding:25px;background:#f5f7fb;margin:10px}span,a{margin-left:30px}</style><h1>动态产品目录</h1><label>分类<select aria-label="分类" onchange="load()"><option value="all">全部</option><option value="software">软件</option></select></label><p id="loading">加载中…</p><main></main><button onclick="page=2;load()">下一页</button><script>let page=1,version=0;function load(){const current=++version;document.querySelector('main').innerHTML='';document.querySelector('#loading').hidden=false;setTimeout(()=>{if(current!==version)return;document.querySelector('main').innerHTML=Array.from({length:5},(_,i)=>`<article data-product><b data-name>Dynamic Software ${(page-1)*5+i+1}</b><span data-price>¥${(i+1)*60}.00</span><a href="/products?id=${i+1}">来源</a></article>`).join('');document.querySelector('main').dataset.page=page;document.querySelector('#loading').hidden=true},600)}load()</script></html>
